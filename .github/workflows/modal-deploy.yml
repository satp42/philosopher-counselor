name: Modal Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys must not overlap or be cancelled midway; a newer push waits for the running deploy.
concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy sep-counselor to Modal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail fast if Modal credentials are missing
        if: env.MODAL_TOKEN_ID == '' || env.MODAL_TOKEN_SECRET == ''
        run: |
          echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET repository secrets are required."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Deploy to Modal
        run: uv run --no-project --python 3.13 --with modal==1.6.1 modal deploy -m backend.app
